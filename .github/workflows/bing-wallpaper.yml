name: Bing Daily Wallpaper

on:
  schedule:
    - cron: "15 0 * * 0"   # 每周日 UTC 00:15 = 北京时间周日 08:15
  workflow_dispatch:        # 也可以在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download today's wallpaper
        run: python3 bing_wallpaper.py 8 -o pics   # 拉最近 8 天（覆盖上周 7 天 + 1 天冗余，已下载的自动跳过）

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Build thumbnails & gallery
        run: python3 make_gallery.py

      - name: Refresh latest.jpg
        run: |
          latest=$(ls pics/*.jpg | sort | tail -n 1)
          cp "$latest" latest.jpg
          echo "latest: $latest"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pics latest.jpg thumbs README.md
          if git diff --cached --quiet; then
            echo "No changes (already up to date)"
          else
            git commit -m "Bing wallpapers week of $(date -u +%F)"
            git push
          fi
