name: Bing Daily Wallpaper

on:
  schedule:
    - cron: "15 0 * * *"   # UTC 00:15 = 北京时间 08:15，Bing 当日图已更新
  workflow_dispatch:        # 也可以在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download today's wallpaper
        run: python3 bing_wallpaper.py 1 -o pics

      - name: Refresh latest.jpg
        run: |
          latest=$(ls pics/*.jpg | sort | tail -n 1)
          cp "$latest" latest.jpg
          echo "latest: $latest"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pics latest.jpg
          if git diff --cached --quiet; then
            echo "No changes (already up to date)"
          else
            git commit -m "Bing wallpaper $(date -u +%F)"
            git push
          fi
