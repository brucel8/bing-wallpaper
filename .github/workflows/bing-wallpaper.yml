name: Bing Daily Wallpaper

on:
  schedule:
    - cron: "15 0 * * 0"   # Sundays 00:15 UTC
  workflow_dispatch:        # can also be triggered manually from the Actions tab

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the past week's wallpapers
        run: python3 bing_wallpaper.py 8 -o pics   # last 8 days (past week + 1 spare day; existing files are skipped)

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Build thumbnails & gallery
        run: python3 make_gallery.py

      - name: Refresh latest.jpg
        run: |
          latest=$(ls pics/*.jpg | sort | tail -n 1)
          cp "$latest" latest.jpg
          echo "latest: $latest"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pics latest.jpg thumbs README.md
          if git diff --cached --quiet; then
            echo "No changes (already up to date)"
          else
            git commit -m "Bing wallpapers week of $(date -u +%F)"
            git push
          fi
